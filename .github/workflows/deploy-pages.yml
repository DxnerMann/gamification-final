name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation-slides
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentation-slides/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage site root
        working-directory: .
        run: |
          mkdir -p _site
          cp -R presentation-slides/dist/* _site/
          mkdir -p _site/presentation-slides
          cp -R presentation-slides/dist/* _site/presentation-slides/
          mkdir -p _site/demo-app
          cp demo-app/README.md _site/demo-app/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
